# GRUB config for Rook's bootable ISO. GRUB loads the Keep as a Multiboot
# kernel and boots it in "shell" mode: an interactive console on the
# keyboard and screen, with no disk or network card assumed, so it comes up
# on a plain PC or VM (Hyper-V Gen 1, VirtualBox, bare metal).
set timeout=3
set default=0

menuentry "Rook — the Keep" {
    multiboot /boot/keep.bin shell
    boot
}
